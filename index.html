<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Redstone Studio</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous" onerror="window.__no3d=true"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="row">
      <button id="btn-view" class="btn" aria-label="2D / 3D">3D</button>
      <div class="group">
        <button id="btn-ydown" class="btn sq" aria-label="Y-">&minus;</button>
        <div id="layer-label" class="label">Y 0</div>
        <button id="btn-yup" class="btn sq" aria-label="Y+">+</button>
      </div>
      <button id="btn-slice" class="btn" aria-pressed="false">Przekrój</button>
      <div id="tick-label" class="label grow">T 0</div>
    </div>
    <div class="row">
      <button id="btn-play" class="btn primary">Start</button>
      <button id="btn-step" class="btn">Krok</button>
      <button id="btn-speed" class="btn">1x</button>
      <button id="btn-debug" class="btn" aria-pressed="false">Debug</button>
      <button id="btn-fit" class="btn sq" aria-label="Fit">&#9635;</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="c2d"></canvas>
    <canvas id="c3d" hidden></canvas>
    <div id="hint" hidden></div>
    <div id="debug" hidden></div>
    <div id="toast" hidden></div>
    <div id="selbar" hidden></div>
    <section id="drawer" hidden>
      <div id="tabs"></div>
      <div id="blocks"></div>
    </section>
  </main>
  <nav id="bar">
    <div class="row modes">
      <button class="btn mode" data-mode="place"></button>
      <button class="btn mode" data-mode="remove"></button>
      <button class="btn mode" data-mode="interact"></button>
      <button class="btn mode" data-mode="select"></button>
    </div>
    <div class="row tools">
      <button id="btn-palette" class="btn chip"><canvas id="sel-thumb" width="40" height="40"></canvas><span id="sel-name"></span></button>
      <button id="btn-rotate" class="btn">Obróć</button>
      <button id="btn-undo" class="btn sq" aria-label="Undo">&#8630;</button>
      <button id="btn-redo" class="btn sq" aria-label="Redo">&#8631;</button>
      <button id="btn-menu" class="btn sq" aria-label="Menu">&#9776;</button>
    </div>
  </nav>
  <div id="sheet" hidden><div class="sheet-body"><div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="btn sq" aria-label="Close">&times;</button></div><div id="sheet-content"></div></div></div>
  <input type="file" id="file-input" accept="application/json,.json" hidden>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
